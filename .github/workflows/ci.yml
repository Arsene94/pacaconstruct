name: CI

on:
  push:
    branches: [main]
  pull_request:

# Anulează rulările vechi pe același ref când vine un push nou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    # Build-ul prerandează rutele SSG (generateStaticParams) → are nevoie de
    # acces la Supabase. Rulează doar dacă secretele sunt configurate.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Guard — secretele Supabase trebuie setate
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL nu e setat — sar peste build."
            exit 0
          fi
          echo "RUN_BUILD=1" >> "$GITHUB_ENV"
      - name: Build
        if: env.RUN_BUILD == '1'
        run: npm run build
